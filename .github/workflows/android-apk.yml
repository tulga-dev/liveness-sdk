# Builds the SDK's test app for Android as an installable APK file.
# Run it by hand: Actions tab -> "Android test app (APK)" -> Run workflow, then download the
# file from the run's "Artifacts" section. Needs the repository secret LIVENESS_SERVER.
name: Android test app (APK)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIVENESS_SERVER: ${{ secrets.LIVENESS_SERVER }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create the Android project
        run: |
          if [ -z "$LIVENESS_SERVER" ]; then echo "::error::The repository secret LIVENESS_SERVER is missing."; exit 1; fi
          flutter create --platforms=android --org mn.kycliveness .
          M=android/app/src/main/AndroidManifest.xml
          # Release builds need the internet permission spelled out; the camera plugin adds its own.
          grep -q 'android.permission.INTERNET' "$M" || perl -0pi -e 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          perl -pi -e 's/android:label="[^"]*"/android:label="Liveness Test"/' "$M"
          cat "$M"

      - name: Build the APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-x64 --build-name=0.2.3 --build-number=${{ github.run_number }} --dart-define=SERVER="$LIVENESS_SERVER"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/liveness-test-0.2.3.apk"
          ls -la "$RUNNER_TEMP"/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liveness-test-apk
          path: ${{ runner.temp }}/liveness-test-0.2.3.apk
          retention-days: 14
